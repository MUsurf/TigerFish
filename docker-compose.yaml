services:

# A service for developing when you have a Raspberry Pi.
  pi:
    build:
      context: ./
      dockerfile: ./Dockerfile
      network: host
      pull: false
      args:
        TORCH_WHEEL: ${TORCH_WHEEL}
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    privileged: true
    network_mode: host
    profiles:
      - pi
    # Allow access to hardware on the pi.
    volumes:
      - ./videos:/home/tigerfish/TigerFish/videos
      - /dev:/dev
      - .:/home/ros2_ws/src
      - ./output_images:/home/ros2_ws/output_images
    # devices:
    #     - "/dev:/dev"
    #     - /dev/gpiochip0:/dev/gpiochip0
    #     - /dev/media4:/dev/media4
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"
      - "/dev/video2:/dev/video2"
      - "/dev/video3:/dev/video3"
    ports:
        - "5000:5000"
    group_add:
      - video

# A service for developing when you don't have a Raspberry Pi.
  no-pi:
    build:
      context: ./
      dockerfile: ./Dockerfile
    profiles:
      - no-pi

# CV development service: x86-safe, no Pi hardware deps, X11 forwarding for
# cv::imshow (calibration node GUI). Run with: docker compose --profile cv-dev up
  cv-dev:
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
    profiles:
      - cv-dev
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      # live source mount — colcon build inside the container picks up edits
      - .:/home/ros2_ws/src
      # X11 socket for OpenCV GUI windows
      - /tmp/.X11-unix:/tmp/.X11-unix
      # drop test videos here; reference as /home/ros2_ws/test_videos/<file>.mp4
      - ./test_videos:/home/ros2_ws/test_videos
      # camera device access for ./cv_dev.sh camera and calibrate modes
      - /dev:/dev
    network_mode: host
    group_add:
      - video
    stdin_open: true
    tty: true

